name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repo-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dependency audit
            script: ci:audit
          - name: Unit tests
            script: ci:test
          - name: Build
            script: ci:build
          - name: Architecture
            script: ci:architecture
          - name: Prompt contracts
            script: ci:prompt-contracts
          - name: Control UI
            script: ci:control-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}

  postgres-startup:
    name: Postgres startup rehearsal
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: panda_test_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d panda_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/panda_test_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Postgres startup rehearsal
        run: pnpm ci:postgres-startup

      - name: Verify atomic Postgres migrations
        run: pnpm ci:postgres-migrations

      - name: Verify paired identity directory query
        run: pnpm ci:paired-identity-directory-postgres

      - name: Verify atomic runtime persistence
        run: pnpm ci:runtime-persistence-postgres

      - name: Verify durable thread abort operations
        run: pnpm ci:thread-abort-operations-postgres

      - name: Verify scheduled task lineage
        run: pnpm ci:scheduled-task-lineage-postgres

      - name: Verify transcript checkpoint queries
        run: pnpm ci:thread-transcript-checkpoints-postgres

      - name: Verify model-call observability persistence
        run: pnpm ci:model-call-observability-postgres
